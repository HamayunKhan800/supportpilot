name: Infrastructure

# Terraform for AWS (plan M8 R7, R8). Started by hand: Actions → Infrastructure → Run workflow.
# Both jobs run in the protected "infra" environment, so the owner approves twice: once to
# see the plan, then again to apply exactly that plan (a saved plan file: if anything changed
# in between, Terraform refuses it).
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply after the plan (still asks for approval)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: infra
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  TF_IN_AUTOMATION: "1"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: infra
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/terraform
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
    steps:
      - name: Check the account variable
        working-directory: .
        run: |
          if [[ ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::Set the repository variable AWS_ACCOUNT_ID (the bootstrap script prints it)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # The environment's IAM user key (github-keys.sh); GitHub hands environment secrets
          # only to jobs the owner approved, on main. It may do nothing but assume this role.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/supportpilot-infra
          role-skip-session-tagging: true
          role-session-name: infra-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Init
        run: terraform init -input=false -lockfile=readonly -backend-config="bucket=supportpilot-tfstate-${AWS_ACCOUNT_ID}"
      - name: Image now live
        id: image
        run: echo "tag=$(../scripts/current-image.sh)" >> "$GITHUB_OUTPUT"
      - name: Plan
        id: plan
        env:
          TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          args=(-input=false -lock-timeout=2m -var-file=production.tfvars -out=tfplan -detailed-exitcode)
          if [[ -n "$IMAGE_TAG" ]]; then args+=(-var "image_tag=${IMAGE_TAG}"); fi
          set +e
          terraform plan "${args[@]}"
          code=$?
          set -e
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac
      # Resource addresses and actions only (no values), so the phone summary is short.
      - name: Summary
        run: terraform show -json tfplan | python3 ../scripts/plan-summary.py >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.changes == 'true'
        with:
          name: tfplan
          path: infra/terraform/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Apply
    needs: plan
    if: needs.plan.outputs.changes == 'true' && inputs.apply
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: infra
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/terraform
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # The environment's IAM user key (github-keys.sh); GitHub hands environment secrets
          # only to jobs the owner approved, on main. It may do nothing but assume this role.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/supportpilot-infra
          role-skip-session-tagging: true
          role-session-name: infra-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Init
        run: terraform init -input=false -lockfile=readonly -backend-config="bucket=supportpilot-tfstate-${AWS_ACCOUNT_ID}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: infra/terraform
      - name: Apply the reviewed plan
        run: terraform apply -input=false -lock-timeout=2m tfplan
      - name: Summary
        run: |
          {
            echo "### Applied"
            echo
            echo "- Functions created: $(terraform output -raw functions_created)"
            echo "- Public address: $(terraform output -raw public_url 2>/dev/null || echo 'not yet')"
          } >> "$GITHUB_STEP_SUMMARY"
