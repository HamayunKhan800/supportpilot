name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default (OWASP A03). Jobs request more only when needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  PG_IMAGE: pgvector/pgvector:0.8.7-pg17-trixie

jobs:
  quality:
    name: Lint · typecheck · format · unit tests · audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test:coverage
      - name: Audit production dependencies (blocking)
        run: pnpm audit --prod --audit-level=high
      - name: Audit all dependencies (report only, see docs/security/accepted-risks.md)
        run: pnpm audit || true
      # Software bill of materials for what ships (M7-10, ASVS V15.1.1, threat T14).
      - name: SBOM (CycloneDX, production dependencies)
        run: pnpm sbom --sbom-format cyclonedx --sbom-type application --prod --out sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  integration:
    name: Integration tests (PostgreSQL + pgvector)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: supportpilot
          POSTGRES_PASSWORD: supportpilot
          POSTGRES_DB: supportpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U supportpilot"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://supportpilot:supportpilot@localhost:5432/supportpilot_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
      # M6 D4: the whole evaluation with the deterministic mock models, through the real
      # pipelines; the build fails if any metric drops below eval/floors.json. Free, no key.
      - name: Evaluation with mock models (regression floors)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          pnpm db:migrate
          pnpm eval --check-floors
      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-mock
          path: eval/results/eval-mock.*
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: E2E (Playwright + axe, production build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: supportpilot
          POSTGRES_PASSWORD: supportpilot
          POSTGRES_DB: supportpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U supportpilot"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://supportpilot:supportpilot@localhost:5432/supportpilot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (without runtime secrets)
        run: env -u DATABASE_URL pnpm build
      - run: pnpm db:migrate
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Generate a throwaway auth secret for this run
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm test:e2e
      # Password reset, sign-up codes and the Google/GitHub buttons, on a server with email on
      # (in-memory outbox; placeholder provider keys, never called). ADR-0020.
      - run: pnpm test:e2e:accounts
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-accounts/
            test-results/
          retention-days: 7

  build-smoke:
    name: Production build + smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [quality]
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: supportpilot
          POSTGRES_PASSWORD: supportpilot
          POSTGRES_DB: supportpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U supportpilot"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://supportpilot:supportpilot@localhost:5432/supportpilot
      BETTER_AUTH_URL: http://localhost:3000
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (without runtime secrets)
        run: env -u DATABASE_URL pnpm build && pnpm build:scripts
      - name: Assemble standalone server (same layout as Docker image)
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
      - name: Run migrations (bundled script)
        run: node .build/migrate.mjs
      - name: Fail-fast check (server must exit 1 without DATABASE_URL)
        working-directory: .next/standalone
        run: |
          set +e
          env -u DATABASE_URL NODE_ENV=production PORT=3999 timeout 20 node server.js
          code=$?
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
      - name: Fail-fast check (worker must exit 1 without required settings)
        run: |
          set +e
          env -u DATABASE_URL NODE_ENV=production timeout 20 node .build/worker.mjs
          code=$?; test "$code" -eq 1 || { echo "no DATABASE_URL: expected exit 1, got $code"; exit 1; }
          env -u AI_PROVIDER NODE_ENV=production timeout 20 node .build/worker.mjs
          code=$?; test "$code" -eq 1 || { echo "no AI_PROVIDER: expected exit 1, got $code"; exit 1; }
      - name: Worker Lambda event handler (start.mjs jobs; plan M8 revision 2)
        # The Lambda Web Adapter posts each event to /events; here curl plays the adapter.
        run: |
          AWS_LWA_PORT=8080 WORKER_DRAIN_IDLE_MS=2000 NODE_ENV=production \
            node .build/start.mjs jobs > "$RUNNER_TEMP/jobs.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          out=$(curl -sS -X POST http://127.0.0.1:8080/events -d '{"task":"drain"}')
          echo "$out"; echo "$out" | grep -q '"ok":true'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/events -d '{"task":"other"}')
          test "$code" = 400 || { echo "unknown event: expected 400, got $code"; exit 1; }
          kill "$pid"; cat "$RUNNER_TEMP/jobs.log"
      - name: Start worker (bundled, without web-app secrets)
        run: |
          NODE_ENV=production node .build/worker.mjs > "$RUNNER_TEMP/worker.log" 2>&1 &
          for _ in $(seq 1 20); do grep -q "worker started" "$RUNNER_TEMP/worker.log" && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/worker.log"; exit 1
      - name: Generate a throwaway auth secret for this run
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Start server
        working-directory: .next/standalone
        run: |
          NODE_ENV=production PORT=3000 HOSTNAME=127.0.0.1 node server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"; exit 1
      - run: pnpm test:smoke
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000
          SMOKE_ORIGIN: http://localhost:3000 # BETTER_AUTH_URL
          SMOKE_DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Server logs
        if: always()
        run: cat "$RUNNER_TEMP/server.log" || true
      - name: Worker logs
        if: always()
        run: cat "$RUNNER_TEMP/worker.log" || true

  infra:
    name: Terraform format · validate · tests · ShellCheck · Trivy scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    env:
      TRIVY_VERSION: 0.76.1
      # From the release's trivy_0.76.1_checksums.txt (verified 2026-10-25).
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive -diff
      - name: Init (no backend, no credentials)
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate
        run: terraform validate
      - name: Offline tests (mocked provider; also checks production.tfvars)
        run: terraform test -var-file=production.tfvars
      # ShellCheck ships with GitHub's Ubuntu runners.
      - name: Shell scripts (bootstrap, image lookup)
        working-directory: infra
        run: shellcheck -S style bootstrap/*.sh scripts/*.sh
      - name: Neon connection-string helper tests
        working-directory: infra/bootstrap
        run: python3 -m unittest -v test_neon_url
      # The binary is pinned by checksum instead of using a third-party action.
      - name: Trivy misconfiguration scan
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | sha256sum -c -
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          cd "$GITHUB_WORKSPACE/infra/terraform"
          "$RUNNER_TEMP/trivy" config --exit-code 1 --severity MEDIUM,HIGH,CRITICAL .

  docker:
    name: Docker image build + container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [quality]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        id: build1
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: supportpilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # public.ecr.aws (the Lambda Web Adapter base) answers 429 to anonymous pulls when GitHub's
      # shared runners exceed its rate limit; one retry after a pause gets past it.
      - name: Wait before retrying (registry rate limit)
        if: steps.build1.outcome == 'failure'
        run: sleep 60
      - name: Build the image (retry)
        id: build2
        if: steps.build1.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: supportpilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start database
        run: |
          docker network create sp
          docker run -d --name db --network sp -p 5432:5432 \
            -e POSTGRES_USER=supportpilot -e POSTGRES_PASSWORD=supportpilot -e POSTGRES_DB=supportpilot \
            "$PG_IMAGE"
          for _ in $(seq 1 30); do docker exec db pg_isready -U supportpilot && break; sleep 1; done
      - name: Run migrations from the image
        run: |
          docker run --rm --network sp \
            -e DATABASE_URL=postgres://supportpilot:supportpilot@db:5432/supportpilot \
            supportpilot:ci node .build/migrate.mjs
      - name: Generate a throwaway auth secret for this run
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Start app container
        run: |
          docker run -d --name app --network sp -p 3000:3000 \
            -e DATABASE_URL=postgres://supportpilot:supportpilot@db:5432/supportpilot \
            -e BETTER_AUTH_SECRET -e BETTER_AUTH_URL=http://localhost:3000 -e AI_PROVIDER=mock \
            supportpilot:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && break; sleep 1; done
      - name: Start worker container (same image, no web-app secrets)
        # The image's HEALTHCHECK probes the web port, so it does not apply to the worker.
        run: |
          docker run -d --name worker --network sp --no-healthcheck \
            -e DATABASE_URL=postgres://supportpilot:supportpilot@db:5432/supportpilot -e AI_PROVIDER=mock \
            supportpilot:ci node .build/worker.mjs
          for _ in $(seq 1 20); do docker logs worker 2>&1 | grep -q "worker started" && exit 0; sleep 1; done
          docker logs worker; exit 1
      - name: Containers run as non-root
        run: |
          for c in app worker; do
            uid=$(docker exec "$c" id -u)
            echo "$c uid=$uid"; test "$uid" != "0"
          done
      - name: Docker HEALTHCHECK reports healthy
        run: |
          for _ in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' app); echo "$s"
            [ "$s" = "healthy" ] && exit 0; sleep 2
          done
          exit 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:smoke
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000
          SMOKE_ORIGIN: http://localhost:3000 # BETTER_AUTH_URL
          SMOKE_DATABASE_URL: postgres://supportpilot:supportpilot@localhost:5432/supportpilot
      - name: Image size
        run: docker image ls supportpilot:ci
      - name: Container logs
        if: always()
        run: |
          docker logs app || true
          echo "--- worker"; docker logs worker || true
